<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web Bluetooth Heart Rate Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.7; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; }
    .row { display: flex; gap: 1rem; align-items: center; margin: .5rem 0; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #log { white-space: pre-wrap; background: #f6f6f6; padding: .75rem; border-radius: .5rem; max-height: 240px; overflow: auto; }
  </style>
</head>
<body>
  <h1>BLE 心拍数センサー (Web Bluetooth)</h1>

  <div class="row">
    <button id="connectBtn">接続する</button>
    <button id="disconnectBtn" disabled>切断</button>
  </div>

  <div class="row"><strong>接続状態:</strong> <span id="status">未接続</span></div>
  <div class="row"><strong>心拍数:</strong> <span id="hr" class="mono">--</span> <span>BPM</span></div>
  <div class="row"><strong>Energy Expended:</strong> <span id="ee" class="mono">--</span> <span>kJ（仕様上はkJ単位相当）</span></div>
  <div class="row"><strong>RR-Intervals:</strong> <span id="rr" class="mono">--</span> <span>（ms）</span></div>

  <h3>ログ</h3>
  <div id="log"></div>

  <script>
    const SERVICE_UUID = 0x180D;      // Heart Rate
    const CHAR_MEAS_UUID = 0x2A37;    // Heart Rate Measurement

    const $ = (id) => document.getElementById(id);
    let device, server, hrService, measChar;

    function log(msg) {
      const el = $("log");
      const time = new Date().toLocaleTimeString();
      el.textContent = `[${time}] ${msg}\n` + el.textContent;
    }

    function setStatus(text) { $("status").textContent = text; }
    function setDisabled(connectDisabled, disconnectDisabled) {
      $("connectBtn").disabled = connectDisabled;
      $("disconnectBtn").disabled = disconnectDisabled;
    }

    // Heart Rate Measurement の仕様に従って生データをパース
    // Spec: https://www.bluetooth.com/specifications/specs/heart-rate-service-1-0/
    function parseHeartRateMeasurement(dataView) {
      const flags = dataView.getUint8(0);
      const hr16 = (flags & 0x01) !== 0;
      const sensorContactSupported = (flags & 0x04) !== 0;
      const sensorContactDetected  = (flags & 0x02) !== 0;
      const energyPresent = (flags & 0x08) !== 0;
      const rrPresent     = (flags & 0x10) !== 0;

      let index = 1;

      let heartRate;
      if (hr16) {
        heartRate = dataView.getUint16(index, /*littleEndian*/ true);
        index += 2;
      } else {
        heartRate = dataView.getUint8(index);
        index += 1;
      }

      let energyExpended = null;
      if (energyPresent) {
        energyExpended = dataView.getUint16(index, true);
        index += 2;
      }

      const rrIntervals = [];
      if (rrPresent) {
        while (index + 1 < dataView.byteLength) {
          const rr = dataView.getUint16(index, true); // in units of 1/1024 s
          rrIntervals.push(Math.round((rr / 1024) * 1000)); // ms に変換
          index += 2;
        }
      }

      return {
        heartRate,
        contact: sensorContactSupported ? (sensorContactDetected ? "Detected" : "Not detected") : "Not supported",
        energyExpended,
        rrIntervals
      };
    }

    async function connect() {
      try {
        setDisabled(true, true);
        setStatus("デバイス選択待ち…");

        device = await navigator.bluetooth.requestDevice({
          // 既知の心拍センサーに絞る場合は filters に namePrefix や manufacturerData を足す
          filters: [{ services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID] // 明示しておくと安心
        });

        device.addEventListener("gattserverdisconnected", onDisconnected);

        setStatus("GATT 接続中…");
        server = await device.gatt.connect();

        hrService = await server.getPrimaryService(SERVICE_UUID);
        measChar = await hrService.getCharacteristic(CHAR_MEAS_UUID);

        await measChar.startNotifications();
        measChar.addEventListener("characteristicvaluechanged", onMeasurement);

        setStatus(`接続中：${device.name || "Heart Rate Device"}`);
        setDisabled(true, false);
        log("通知の購読を開始しました。");
      } catch (err) {
        console.error(err);
        log("エラー: " + err.message);
        setStatus("未接続");
        setDisabled(false, true);
      }
    }

    function onMeasurement(event) {
      const dv = event.target.value; // DataView
      const parsed = parseHeartRateMeasurement(dv);

      $("hr").textContent = parsed.heartRate ?? "--";
      $("ee").textContent = parsed.energyExpended ?? "--";
      $("rr").textContent = parsed.rrIntervals.length ? parsed.rrIntervals.join(", ") : "--";

      log(`HR=${parsed.heartRate}bpm / contact=${parsed.contact} / EE=${parsed.energyExpended ?? "-"} / RR=${parsed.rrIntervals.join(", ") || "-"}`);
    }

    async function disconnect() {
      try {
        if (measChar) {
          await measChar.stopNotifications();
          measChar.removeEventListener("characteristicvaluechanged", onMeasurement);
        }
        if (device?.gatt?.connected) device.gatt.disconnect();
      } catch (err) {
        console.error(err);
        log("切断時エラー: " + err.message);
      } finally {
        setStatus("未接続");
        setDisabled(false, true);
        log("切断しました。");
      }
    }

    function onDisconnected() {
      setStatus("切断（デバイス側）");
      setDisabled(false, true);
      log("デバイス側で切断されました。");
    }

    $("connectBtn").addEventListener("click", () => {
      if (!("bluetooth" in navigator)) {
        alert("このブラウザは Web Bluetooth に対応していません。Chrome/Edge をご利用ください。");
        return;
      }
      connect();
    });

    $("disconnectBtn").addEventListener("click", disconnect);
  </script>
</body>
</html>
