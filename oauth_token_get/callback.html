<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
</head>
<body>
  <input id="t" style="width:500px">
<script>
const token = location.hash.substring(1).split('&').map(_ => _.split('=')).find(_ => _[0] == 'access_token')[1];
document.querySelector('#t').value = token;
window.onload = () => {
  document.querySelector('#t').focus();
  document.querySelector('#t').select();
};
</script>
</body>
</html>
